services:
  postgres:
    image: postgres:16-alpine
    container_name: dockhand-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_NAME}
    volumes:
      - dbdata:/var/lib/postgresql/data
    restart: always
    networks:
      local:

  dockhand:
    image: fnsys/dockhand:${DOCKHAND_IMAGE_VERSION:-latest}
    container_name: dockhand-app
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB_NAME}
      PUID: ${PUID:-1001}
      PGID: ${PGID:-1001}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKHAND_DATA_FOLDER:-./data}:/app/data
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      external:
        ipv4_address: ${DOCKHAND_IP_ADDRESS}
      local:

volumes:
  dbdata:
    name: dockhand-dbdata

networks:
  external:
    external: true
    name: ${EXTERNAL_NETWORK_NAME}
  local:
    name: dockhand-internal-network